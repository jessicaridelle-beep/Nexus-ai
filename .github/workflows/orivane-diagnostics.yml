name: ORIVANE diagnostics
on:
  push:
    branches: [main]
    paths-ignore:
      - Orivane-report.json
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: orivane-diagnostics
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Attempt safe automatic repairs
        id: repair
        continue-on-error: true
        env:
          ORIVANE_REPAIR_REPORT: /tmp/orivane-repair-report.json
        run: node scripts/orivane-auto-repair.mjs
      - name: Install browser test dependencies
        id: browser_setup
        continue-on-error: true
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo "ORIVANE_CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Run browser diagnostics
        id: browser
        if: steps.browser_setup.outcome == 'success'
        continue-on-error: true
        env:
          ORIVANE_BROWSER_REPORT: /tmp/orivane-browser-report.json
          ORIVANE_LIVE_TEST: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, 'Enable automated browser diagnostics') }}
        run: node scripts/orivane-browser-tests.mjs
      - name: Record browser setup failure
        if: always()
        run: |
          if [ ! -s /tmp/orivane-browser-report.json ]; then
            node -e 'const fs=require("node:fs");fs.writeFileSync("/tmp/orivane-browser-report.json",JSON.stringify({checks:[{name:"Browser runner setup or execution failed",status:"fail",code:process.env.SETUP_STATUS==="success"?"browser_execution_failed":"browser_install_failed"}]}))'
          fi
        env:
          SETUP_STATUS: ${{ steps.browser_setup.outcome }}
      - name: Record browser setup failure
        if: steps.browser_setup.outcome != 'success'
        run: |
          node -e 'require("fs").writeFileSync("/tmp/orivane-browser-report.json",JSON.stringify({checks:[{name:"Browser dependency setup",status:"fail",code:"browser_setup_failed"}]}))'
      - name: Run diagnostics
        id: diagnose
        continue-on-error: true
        env:
          ORIVANE_BROWSER_REPORT: /tmp/orivane-browser-report.json
          ORIVANE_REPORT_TOKEN: ${{ secrets.ORIVANE_REPORT_TOKEN }}
          ORIVANE_REPAIR_REPORT: /tmp/orivane-repair-report.json
        run: node scripts/orivane-diagnostics.mjs
      - name: Save validated repair and report
        if: always()
        env:
          REPAIR_OK: ${{ steps.repair.outcome == 'success' && steps.diagnose.outcome == 'success' && steps.browser.outcome == 'success' }}
        run: |
          test -f Orivane-report.json
          git config user.name "orivane-diagnostics[bot]"
          git config user.email "orivane-diagnostics[bot]@users.noreply.github.com"
          if ! git diff --quiet -- sw.js; then
            if [ "$REPAIR_OK" = "true" ]; then
              git add sw.js
              node -e 'const fs=require("fs"),p="Orivane-report.json",r=JSON.parse(fs.readFileSync(p));r.autoRepair.status="validated";fs.writeFileSync(p,JSON.stringify(r,null,2)+"\n")'
            else
              git restore -- sw.js
              node -e 'const fs=require("fs"),p="Orivane-report.json",r=JSON.parse(fs.readFileSync(p));r.autoRepair.status="rejected";fs.writeFileSync(p,JSON.stringify(r,null,2)+"\n")'
            fi
          fi
          git add Orivane-report.json
          if ! git diff --cached --quiet; then
            if git diff --cached --quiet -- sw.js; then
              git commit -m "Update Orivane-report [skip ci]"
            else
              git commit -m "Repair service worker asset versions"
            fi
            git push origin HEAD:main
          fi
      - name: Upload diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Orivane-report
          path: Orivane-report.json
          retention-days: 7
      - name: Mark failed checks
        if: steps.diagnose.outcome != 'success' || steps.repair.outcome != 'success' || steps.browser_setup.outcome == 'failure' || steps.browser.outcome == 'failure'
        run: exit 1
